apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: three-tier
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: root123
  MYSQL_DATABASE: appdb
  MYSQL_USER: appuser
  MYSQL_PASSWORD: apppass

# This Secret stores MySQL credentials and database information
# for the three-tier application in the 'three-tier' namespace.
# It includes the root password, database name, username, and user password.
